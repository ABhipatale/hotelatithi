      #splash { display: none; }
      .js #splash {
        position: fixed;
        inset: 0;

        display: grid;

        overflow: hidden;
        background:
          radial-gradient(60% 50% at 50% 42%, rgb(110 8 20 / 0.6), transparent 70%),

      .js.splash-seen #splash { display: none; }
      .js.splash-on, .js.splash-on body { overflow: hidden; }
      .js #splash.is-leaving { clip-path: inset(0 0 100% 0); visibility: hidden; }

      /* fine grain, so the dark field reads as paper rather than a flat fill */

        flex-direction: column;
        align-items: center;
        padding: 0 16px;

        transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.5s ease;
      }
      #splash.is-leaving .splash-inner { transform: translateY(-40px); opacity: 0; }

      .splash-mark {
        position: relative;
        width: clamp(118px, 34vw, 156px);
        aspect-ratio: 1;
      }
      .splash-glow {
        position: absolute;
        inset: -38%;
        border-radius: 50%;

      .splash-badge {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 24px 60px -18px rgb(0 0 0 / 0.7), 0 0 0 1px rgb(255 248 240 / 0.08);

      }
      .splash-ring {
        position: absolute;
        inset: -14px;
        width: calc(100% + 28px);
        height: calc(100% + 28px);
        overflow: visible;
      }

  <body>
    <!-- Marks that scripting is on, so the reveal CSS may hide things. Set
         before paint; without it the page renders fully visible, which is what
         a crawler and a no-JS reader should get. -->
    <script>document.documentElement.classList.add("js");</script>

    <!-- Shown once per browser session, held for at least MIN ms so the
         entrance reads as intended, lifted on window load, and never kept up
         longer than MAX ms however slow the connection. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          if (sessionStorage.getItem("atithi-splash")) {
            root.classList.add("splash-seen");
            return;
          }
        } catch (e) {}
        root.classList.add("splash-on");

        var MIN = 1600, MAX = 4000, start = Date.now(), done = false;
        function finish() {
          if (done) return;
          done = true;
          var el = document.getElementById("splash");
          if (!el) return root.classList.remove("splash-on");
          el.classList.add("is-leaving");
          root.classList.remove("splash-on");
          try { sessionStorage.setItem("atithi-splash", "1"); } catch (e) {}
          setTimeout(function () { el.remove(); }, 900);
        }
        function onLoad() {
          setTimeout(finish, Math.max(0, MIN - (Date.now() - start)));
        }
        if (document.readyState === "complete") onLoad();
        else window.addEventListener("load", onLoad);
        setTimeout(finish, MAX);
      })();
    </script>
    <div id="splash" role="status" aria-label="हॉटेल अतिथी — लोड होत आहे">
      <div class="splash-inner">
        <div class="splash-mark">
          <span class="splash-glow" aria-hidden="true"></span>
          <svg class="splash-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" cx="50" cy="50" r="49" fill="none" stroke-width="1" />
            <circle class="arc" cx="50" cy="50" r="49" fill="none" stroke-width="1.6" pathLength="100" stroke-dasharray="22 78" />
          </svg>
          <img class="splash-badge" src="/splash-badge.png" alt="" width="156" height="156" />
        </div>
        <p class="splash-name">हॉटेल अतिथी</p>
        <span class="splash-rule" aria-hidden="true"></span>
        <p class="splash-tag">गावाकडची माणसं... गावाकडची चव..!</p>
      </div>
      <p class="splash-place">Family Garden Restaurant · Karad</p>
    </div>

    <script type="module" src="/src/main.jsx"></script>
